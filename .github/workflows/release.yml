name: Draft Windows Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build, verify, and draft release
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Check out release tag
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Configure Release build
        shell: pwsh
        run: |
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            -DAEROFORGE_BUILD_VISUALIZATION=ON `
            -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build all targets
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 4
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run regression suite
        shell: pwsh
        run: |
          ctest --test-dir build -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage release package
        shell: pwsh
        run: |
          $destination = 'dist/AeroForge'
          New-Item -ItemType Directory -Path $destination -Force | Out-Null

          $required = @(
            'AeroForge.exe',
            'AeroForgeVisualizer.exe',
            'AeroForgeHilBenchmarks.exe',
            'AeroForgeHilHardwareBenchmarks.exe',
            'AeroForgeVerificationAudit.exe'
          )

          foreach ($name in $required) {
            $source = Get-ChildItem build -Recurse -File -Filter $name |
              Where-Object { $_.DirectoryName -match '[\\/]Release$' } |
              Select-Object -First 1 -ExpandProperty FullName

            if (-not $source) {
              throw "Required release executable missing: $name"
            }

            Copy-Item $source -Destination $destination
          }

          if (-not (Test-Path LICENSE)) { throw 'LICENSE is required for this release' }
          Copy-Item README.md -Destination $destination
          Copy-Item LICENSE -Destination $destination
          Copy-Item docs -Destination $destination -Recurse -Force
          Copy-Item demo -Destination $destination -Recurse -Force

          # Preserve bundled third-party license texts from CMake FetchContent sources.
          $licenseDestination = Join-Path $destination 'THIRD_PARTY_LICENSES'
          New-Item -ItemType Directory -Path $licenseDestination -Force | Out-Null
          foreach ($dependency in (Get-ChildItem 'build/_deps' -Directory | Where-Object { $_.Name -like '*-src' })) {
            foreach ($pattern in @('LICENSE*', 'COPYING*', 'NOTICE*')) {
              foreach ($licenseFile in (Get-ChildItem $dependency.FullName -File -Filter $pattern -ErrorAction SilentlyContinue)) {
                Copy-Item $licenseFile.FullName -Destination (Join-Path $licenseDestination "$($dependency.Name)-$($licenseFile.Name)") -Force
              }
            }
          }

          Compress-Archive -Path "$destination/*" `
            -DestinationPath 'dist/AeroForge-windows-x64.zip' -Force

          $hash = (Get-FileHash 'dist/AeroForge-windows-x64.zip' -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  AeroForge-windows-x64.zip" | Set-Content 'dist/AeroForge-windows-x64.zip.sha256' -Encoding ascii

      - name: Create draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$env:GITHUB_REF_NAME" `
            'dist/AeroForge-windows-x64.zip' `
            'dist/AeroForge-windows-x64.zip.sha256' `
            --verify-tag `
            --draft `
            --title "AeroForge $env:GITHUB_REF_NAME" `
            --notes-file 'docs/releases/v0.1.0.md'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
